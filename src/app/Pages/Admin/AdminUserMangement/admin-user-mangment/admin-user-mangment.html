<div class="admin-wrapper">
  <!-- Header Card -->
  <div class="dashboard-header">
    <div class="header-main">
      <div class="header-title">
        <span class="badge">Admin Panel</span>
        <h2>User Management</h2>
      </div>
      <p class="status-tag">✂️ Barber & Salon Management</p>
    </div>

    <!-- Search Input Box -->
    <div class="search-wrapper">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" placeholder="Search user by name or email..." />
      </div>
    </div>
  </div>

  <!-- Table Container (Fully Responsive) -->
  <div class="table-responsive">
    <table class="salon-table">
      <thead>
        <tr>
          <th>Id</th>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th class="text-end">Action</th>
        </tr>
      </thead>
      <tbody>
        @for(user of UserList; track $index) {
          <tr>
            <td data-label="Id" class="id-col">#{{user.id}}</td>
            <td data-label="Name" class="user-name">{{user.name}}</td>
            <td data-label="Email" class="user-email">{{user.email}}</td>
            
            @if(!RoleChange) {
              <td data-label="Role">
                <span class="role-pill">{{user.role}}</span>
              </td>
            } @else {
              <td data-label="Role">
                <select (change)="UpdateRole($any($event.target).value)" class="salon-select" [disabled]="Isloading">
                  @for(role of RoleList; track $index) {
                    <option [value]="role.role">{{role.role}}</option>
                  }
                </select>
              </td>
            }
            
            <td data-label="Action" class="text-end">
              <button 
                class="salon-btn" 
                [class.btn-cancel]="RoleChange" 
                (click)="RoleChange ? CencelRoleButton() : ChangeRoleButton(user.id)">
                {{RoleChange ? 'Cancel' : 'Change Role'}}
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <!-- Pagination Controls Container -->
  <div class="pagination-footer">
    <div class="pagination-info">
      Showing <span>1 to 10</span> of <span>{{UserList?.length || 0}}</span> users
    </div>
    <div class="pagination-actions">
      <button class="pg-btn" disabled>&laquo; Prev</button>
      <button class="pg-btn active">1</button>
      <button class="pg-btn">2</button>
      <button class="pg-btn">Next &raquo;</button>
    </div>
  </div>
</div>
